name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Bundle genuine XLSX library for offline app use
        run: |
          set -eu
          mkdir -p www/vendor
          if [ -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/xlsx.full.min.js
          elif [ -s node_modules/xlsx/xlsx.full.min.js ]; then
            cp node_modules/xlsx/xlsx.full.min.js www/vendor/xlsx.full.min.js
          else
            echo "Local SheetJS bundle not found; fetching the pinned 0.18.5 browser bundle."
            curl --fail --location --retry 3 --retry-delay 2 \
              https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js \
              --output www/vendor/xlsx.full.min.js
          fi
          test -s www/vendor/xlsx.full.min.js
          echo "SheetJS bundle ready: $(wc -c < www/vendor/xlsx.full.min.js) bytes"

      - name: Verify canonical Excel template asset
        run: |
          set -eu
          test -s www/workout-template.xlsx || { echo "::error::Canonical uploaded Excel template is missing at www/workout-template.xlsx"; exit 1; }
          echo "Canonical workbook packaged: $(wc -c < www/workout-template.xlsx) bytes"

      - name: Verify web app entry point
        run: |
          set -eu
          if [ ! -s www/index.html ]; then
            echo "www/index.html is missing at the repository root. Searching for a nested V3 app folder..."
            FOUND=$(find . -mindepth 3 -path '*/www/index.html' -not -path './node_modules/*' -not -path './android/*' -print -quit || true)
            if [ -n "$FOUND" ]; then
              APP_ROOT="${FOUND%/www/index.html}"
              echo "Found app entry point at $FOUND; copying its web assets and config to repository root."
              mkdir -p www
              cp -R "$APP_ROOT/www/." www/
              for FILE in package.json capacitor.config.json patch_manifest.py; do
                if [ -f "$APP_ROOT/$FILE" ]; then cp "$APP_ROOT/$FILE" "./$FILE"; fi
              done
              if [ -d "$APP_ROOT/android-overrides" ]; then cp -R "$APP_ROOT/android-overrides" ./; fi
            fi
          fi
          test -s www/index.html || { echo "::error::www/index.html is missing. Upload the contents of the V3 project folder, including www/index.html."; exit 1; }
          echo "Web entry point found ($(wc -c < www/index.html) bytes)."

      - name: Create the Android project
        run: npx cap add android

      - name: Add custom code and permissions
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APP_ID" | tr . /)
          mkdir -p "$DIR"
          cp android-overrides/*.java "$DIR/"
          sed -i "s/APP_PACKAGE/$APP_ID/" "$DIR"/*.java
          python3 patch_manifest.py

      - name: Copy the app files into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Workouts-V3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
